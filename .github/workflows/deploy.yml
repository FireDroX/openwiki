name: Deploy

# Runs only after the CI workflow completes successfully on main — never
# on a PR, and never if lint/tests/build failed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH over the Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.DEPLOY_SSH_HOSTNAME }}
            User ${{ secrets.DEPLOY_SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

      # First deploy on a fresh server is expected to fail here: the
      # .env files (root, backend/, frontend/) aren't committed to git,
      # so `docker compose up` has nothing to read env vars from until
      # someone creates them by hand on the server. Every deploy after
      # that succeeds.
      #
      # docker-compose.external.yml (not the full docker-compose.yml):
      # this deploy target reuses an already-existing mariadb/minio
      # rather than running its own — see the Déploiement wiki page.
      # DEPLOY_PATH is intentionally unquoted below so `~` in it still
      # expands remotely (quoted, bash treats `~` as a literal char).
      - name: git pull && docker compose (external) up -d --build
        run: |
          ssh deploy-target "cd ${{ secrets.DEPLOY_PATH }} && git pull && docker compose -f docker-compose.external.yml up -d --build"
