# Version complète (mysql + minio + backend + frontend) — pour un
# serveur vierge. Si mariadb/minio existent déjà sur le serveur, voir
# docker-compose.external.yml à la place.
services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - mariadb-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - mariadb-network

  # Application containers (production deploy — see README §9). Not
  # needed for local dev, where the backend/frontend run via `pnpm run
  # start:dev` / `pnpm run dev` against these same mysql/minio services.
  #
  # backend/.env on the server must point DB_HOST/MINIO_ENDPOINT at the
  # `mysql`/`minio` service names below (not `localhost`, unlike the
  # local-dev default in backend/.env.example) — see README §9.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - mariadb-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - mariadb-network

networks:
  mariadb-network:
    driver: bridge

volumes:
  mysql-data:
  minio-data:
