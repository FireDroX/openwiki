# Variante "mariadb/minio déjà existants sur le serveur" — voir la page
# Déploiement (documentation/guide-demarrage/deploiement) pour le détail.
# Ne définit ni `mysql` ni `minio` : rejoint le réseau Docker externe où
# vivent déjà ces conteneurs (`mariadb-network`, à adapter si le vôtre
# porte un autre nom) plutôt que d'en relancer une paire dédiée.
#
# `backend/.env` doit pointer DB_HOST/MINIO_ENDPOINT vers les noms de
# conteneur réels de ce mariadb/minio existants, pas `mysql`/`minio`.
#
# Non branché sur le déploiement continu (.github/workflows/deploy.yml
# lance toujours `docker compose up -d --build` sans -f, donc la version
# complète) — usage manuel uniquement : `docker compose -f
# docker-compose.external.yml up -d --build`.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    ports:
      - "3000:3000"
    networks:
      - mariadb-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - mariadb-network

networks:
  mariadb-network:
    external: true
